frr defaults traditional
hostname r1
no ipv6 forwarding
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
! Enables the AgentX SNMP subagent in every daemon that reads this file
! and was built with SNMP support (zebra, bgpd, ospfd via frr-snmp).
agentx
!
interface eth1
 ip address 10.0.12.1/30
!
interface lo
 ip address 10.0.0.1/32
!
router ospf
 ospf router-id 10.0.0.1
 network 10.0.12.0/30 area 0
 network 10.0.0.1/32 area 0
 passive-interface lo
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 description r2-loopback
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 ebgp-multihop 2
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 soft-reconfiguration inbound
 exit-address-family
!
line vty
!
end
