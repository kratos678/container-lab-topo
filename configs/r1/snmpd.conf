# snmpd is the local SNMP master agent for this node. It answers
# IF-MIB / HOST-RESOURCES-MIB / UCD-SNMP-MIB directly (interfaces, CPU,
# memory) and relays OSPF-MIB / BGP4-MIB / LLDP-MIB from FRR and lldpd,
# which attach to it as AgentX subagents over /var/agentx/master.

agentaddress udp:161

# --- SNMPv2c (default, community-based) ---
# Read-only community "public" reachable from anywhere. SNMPv2c is
# unauthenticated/cleartext; fine for an isolated lab, not for anything
# exposed beyond it. See the SNMPv3 alternative commented out below.
rocommunity public default -V all

# --- SNMPv3 (optional, authenticated + encrypted) ---
# Uncomment for authenticated/encrypted polling instead of/alongside v2c.
# createUser selector-mon SHA "ChangeMe-Auth-Passphrase1" AES "ChangeMe-Priv-Passphrase1"
# rouser selector-mon priv -V all

view all included .1

master agentx
agentXSocket /var/agentx/master
agentXPerms 0777 0777

sysLocation    clab-frr-ospf-bgp-snmp / r1
sysContact     netops@selector.ai
sysServices    78
