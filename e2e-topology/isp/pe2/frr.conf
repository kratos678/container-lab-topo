frr defaults traditional
hostname pe2
no ipv6 forwarding
log file /var/log/frr/frr.log informational
log syslog informational
log commands
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1 vrf CUST-A
 ip address 100.64.2.1/30
!
interface eth2
 ip address 10.0.12.10/30
!
interface eth3
 ip address 10.0.12.33/30
!
mpls ldp
 router-id 10.0.0.3
 !
 address-family ipv4
  discovery transport-address 10.0.0.3
  !
  interface eth2
  !
  interface eth3
 exit-address-family
!
router ospf
 ospf router-id 10.0.0.3
 network 10.0.0.3/32 area 0
 network 10.0.12.8/30 area 0
 network 10.0.12.32/30 area 0
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.0.0.3
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description rr1-vpnv4
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 10.0.0.2 activate
 exit-address-family
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 100.64.2.2 remote-as 65513
 neighbor 100.64.2.2 description dc-border1-circuitA
 !
 address-family ipv4 unicast
  neighbor 100.64.2.2 activate
  label vpn export auto
  rd vpn export 10.0.0.3:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
line vty
!
end
