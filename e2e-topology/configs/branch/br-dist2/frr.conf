frr defaults traditional
hostname br-dist2
no ipv6 forwarding
log file /var/log/frr/frr.log informational
log syslog informational
log commands
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.1.0.3/32
!
interface eth2
 ip address 10.1.3.1/30
!
interface eth3
 ip address 10.1.1.2/30
!
interface eth1.10
 ip address 10.1.10.3/24
!
interface eth1.20
 ip address 10.1.20.1/24
!
router ospf
 ospf router-id 10.1.0.3
 network 10.1.0.3/32 area 0
 network 10.1.1.0/30 area 0
 network 10.1.3.0/30 area 0
 network 10.1.10.0/24 area 0
 network 10.1.20.0/24 area 0
 passive-interface lo
 passive-interface eth1.10
 passive-interface eth1.20
!
line vty
!
end
