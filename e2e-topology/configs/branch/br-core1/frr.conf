frr defaults traditional
hostname br-core1
no ipv6 forwarding
log file /var/log/frr/frr.log informational
log syslog informational
log commands
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.1.0.1/32
!
interface eth1
 ip address 10.1.2.2/30
!
interface eth2
 ip address 10.1.3.2/30
!
interface eth3
 ip address 100.64.1.1/30
!
interface eth4
 ip address 100.64.1.5/30
!
router ospf
 ospf router-id 10.1.0.1
 network 10.1.0.1/32 area 0
 network 10.1.2.0/30 area 0
 network 10.1.3.0/30 area 0
 passive-interface lo
 redistribute bgp
!
router bgp 65100
 bgp router-id 10.1.0.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.2 remote-as 65000
 neighbor 100.64.1.2 description isp-pe1-circuitA
 neighbor 100.64.1.6 remote-as 65000
 neighbor 100.64.1.6 description isp-pe3-circuitB
 !
 address-family ipv4 unicast
  redistribute ospf
  neighbor 100.64.1.2 activate
  neighbor 100.64.1.6 activate
 exit-address-family
!
line vty
!
end
