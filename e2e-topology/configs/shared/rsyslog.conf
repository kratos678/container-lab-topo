# Minimal rsyslog config: accept local syslog() traffic (FRR's "log
# syslog" output, including "log commands" config-change audit records)
# and forward all of it to the monitoring host's syslog receiver, while
# keeping a local copy for on-box troubleshooting.

module(load="imuxsock")

*.* action(type="omfwd" target="10.167.0.9" port="514" protocol="udp")
*.* /var/log/syslog
