# snmpd is the local SNMP master agent for this node. It answers
# IF-MIB / HOST-RESOURCES-MIB / UCD-SNMP-MIB directly (interfaces, CPU,
# memory) and relays OSPF-MIB / BGP4-MIB / LLDP-MIB from FRR and lldpd,
# which attach to it as AgentX subagents over /var/agentx/master.

agentaddress udp:161

# SNMPv2c, read-only community "public", reachable from anywhere. This is
# unauthenticated/cleartext and is only appropriate on an isolated lab
# management network — see README.md security notes before reusing it
# anywhere less isolated.
rocommunity public default -V all

view all included .1

master agentx
agentXSocket /var/agentx/master
agentXPerms 0777 0777

sysLocation    e2e-topology / spine2
sysContact     netops@selector.ai
sysServices    78
