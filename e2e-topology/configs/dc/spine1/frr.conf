frr defaults traditional
hostname spine1
no ipv6 forwarding
log file /var/log/frr/frr.log informational
log syslog informational
log commands
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.2.0.2/32
!
interface eth1
 ip address 10.2.12.2/30
!
interface eth2
 ip address 10.2.12.9/30
!
interface eth3
 ip address 10.2.12.22/30
!
route-map UNCHANGED-NHOP permit 10
 set ip next-hop unchanged
!
router bgp 65501
 bgp router-id 10.2.0.2
 no bgp ebgp-requires-policy
 neighbor 10.2.12.1 remote-as 65513
 neighbor 10.2.12.1 description border1
 neighbor 10.2.12.10 remote-as 65511
 neighbor 10.2.12.10 description leaf1
 neighbor 10.2.12.21 remote-as 65512
 neighbor 10.2.12.21 description leaf2
 !
 address-family ipv4 unicast
  network 10.2.0.2/32
  neighbor 10.2.12.1 activate
  neighbor 10.2.12.10 activate
  neighbor 10.2.12.21 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.2.12.1 activate
  neighbor 10.2.12.10 activate
  neighbor 10.2.12.21 activate
  neighbor 10.2.12.1 route-map UNCHANGED-NHOP out
  neighbor 10.2.12.10 route-map UNCHANGED-NHOP out
  neighbor 10.2.12.21 route-map UNCHANGED-NHOP out
 exit-address-family
!
line vty
!
end
