frr defaults traditional
hostname rr1
no ipv6 forwarding
log file /var/log/frr/frr.log informational
log syslog informational
log commands
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 ip address 10.0.12.53/30
!
interface eth2
 ip address 10.0.12.57/30
!
router ospf
 ospf router-id 10.0.0.2
 network 10.0.0.2/32 area 0
 network 10.0.12.52/30 area 0
 network 10.0.12.56/30 area 0
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.0.0.2
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 description pe1-vpnv4
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 update-source lo
 neighbor 10.0.0.3 description pe2-vpnv4
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 update-source lo
 neighbor 10.0.0.4 description pe3-vpnv4
 neighbor 10.0.0.5 remote-as 65000
 neighbor 10.0.0.5 update-source lo
 neighbor 10.0.0.5 description pe4-vpnv4
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.1 activate
  no neighbor 10.0.0.3 activate
  no neighbor 10.0.0.4 activate
  no neighbor 10.0.0.5 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 route-reflector-client
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 route-reflector-client
  neighbor 10.0.0.4 activate
  neighbor 10.0.0.4 route-reflector-client
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.5 route-reflector-client
 exit-address-family
!
line vty
!
end
