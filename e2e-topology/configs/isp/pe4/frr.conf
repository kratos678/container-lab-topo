frr defaults traditional
hostname pe4
no ipv6 forwarding
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.0.0.5/32
!
interface eth1
 vrf CUST-A
 ip address 100.64.2.5/30
!
interface eth2
 ip address 10.0.12.22/30
!
interface eth3
 ip address 10.0.12.37/30
!
mpls ldp
 router-id 10.0.0.5
 !
 address-family ipv4
  discovery transport-address 10.0.0.5
  !
  interface eth2
  !
  interface eth3
 exit-address-family
!
router ospf
 ospf router-id 10.0.0.5
 network 10.0.0.5/32 area 0
 network 10.0.12.20/30 area 0
 network 10.0.12.36/30 area 0
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.0.0.5
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description rr1-vpnv4
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 10.0.0.2 activate
 exit-address-family
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.5
 no bgp ebgp-requires-policy
 neighbor 100.64.2.6 remote-as 65513
 neighbor 100.64.2.6 description dc-border1-circuitB
 !
 address-family ipv4 unicast
  neighbor 100.64.2.6 activate
  label vpn export auto
  rd vpn export 10.0.0.5:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
line vty
!
end
