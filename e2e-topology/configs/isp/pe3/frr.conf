frr defaults traditional
hostname pe3
no ipv6 forwarding
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.0.0.4/32
!
interface eth1
 vrf CUST-A
 ip address 100.64.1.6/30
!
interface eth2
 ip address 10.0.12.13/30
!
interface eth3
 ip address 10.0.12.29/30
!
mpls ldp
 router-id 10.0.0.4
 !
 address-family ipv4
  discovery transport-address 10.0.0.4
  !
  interface eth2
  !
  interface eth3
 exit-address-family
!
router ospf
 ospf router-id 10.0.0.4
 network 10.0.0.4/32 area 0
 network 10.0.12.12/30 area 0
 network 10.0.12.28/30 area 0
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.0.0.4
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description rr1-vpnv4
 !
 address-family ipv4 unicast
  no neighbor 10.0.0.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 10.0.0.2 activate
 exit-address-family
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.0.0.4
 no bgp ebgp-requires-policy
 neighbor 100.64.1.5 remote-as 65100
 neighbor 100.64.1.5 description branch-br-core1-circuitB
 !
 address-family ipv4 unicast
  neighbor 100.64.1.5 activate
  label vpn export allocation-mode per-vrf
  rd vpn export 10.0.0.4:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
!
line vty
!
end
