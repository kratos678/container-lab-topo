frr defaults traditional
hostname p4
no ipv6 forwarding
log file /var/log/frr/frr.log informational
log syslog informational
log commands
service integrated-vtysh-config
!
agentx
!
interface lo
 ip address 10.0.0.14/32
!
interface eth1
 ip address 10.0.12.18/30
!
interface eth2
 ip address 10.0.12.21/30
!
interface eth3
 ip address 10.0.12.34/30
!
interface eth4
 ip address 10.0.12.46/30
!
interface eth5
 ip address 10.0.12.50/30
!
mpls ldp
 router-id 10.0.0.14
 !
 address-family ipv4
  discovery transport-address 10.0.0.14
  !
  interface eth1
  !
  interface eth2
  !
  interface eth3
  !
  interface eth4
  !
  interface eth5
 exit-address-family
!
router ospf
 ospf router-id 10.0.0.14
 network 10.0.0.14/32 area 0
 network 10.0.12.16/30 area 0
 network 10.0.12.20/30 area 0
 network 10.0.12.32/30 area 0
 network 10.0.12.44/30 area 0
 network 10.0.12.48/30 area 0
 passive-interface lo
!
line vty
!
end
